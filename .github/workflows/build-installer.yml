name: Build and Deploy App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Restore NuGet packages
      working-directory: winforms/BaridaRecipeManager
      run: nuget restore BaridaRecipeManager.csproj -PackagesDirectory packages
    
    - name: Build WinForms Application
      working-directory: winforms/BaridaRecipeManager
      run: msbuild BaridaRecipeManager.csproj /p:Configuration=Release /t:Rebuild
    
    - name: Get version
      id: version
      run: |
        $version = (Select-String -Path "winforms/BaridaRecipeManager/Program.cs" -Pattern 'APP_VERSION = "(.+)"').Matches.Groups[1].Value
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
    
    - name: Create release package
      working-directory: winforms/BaridaRecipeManager/bin/Release
      run: |
        # Remove unnecessary files
        Remove-Item -Path "*.pdb" -ErrorAction SilentlyContinue
        Remove-Item -Path "*.xml" -ErrorAction SilentlyContinue
        Remove-Item -Path "*.config" -ErrorAction SilentlyContinue
        Remove-Item -Path "*.manifest" -ErrorAction SilentlyContinue
        Remove-Item -Path "*.application" -ErrorAction SilentlyContinue
        Remove-Item -Path "app.publish" -Recurse -ErrorAction SilentlyContinue
        
        # Create zip
        Compress-Archive -Path "*" -DestinationPath "BaridaRecipeManager.zip" -Force
        
        # List contents
        Get-ChildItem
    
    - name: Copy to frontend downloads
      run: |
        # Ensure downloads folder exists
        New-Item -ItemType Directory -Path "frontend/public/downloads" -Force | Out-Null
        
        # Copy zip
        Copy-Item "winforms/BaridaRecipeManager/bin/Release/BaridaRecipeManager.zip" "frontend/public/downloads/BaridaRecipeManager.zip" -Force
        
        # Also copy standalone exe for quick access
        Copy-Item "winforms/BaridaRecipeManager/bin/Release/BaridaRecipeManager.exe" "frontend/public/downloads/BaridaRecipeManager.exe" -Force
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BaridaRecipeManager-v${{ steps.version.outputs.VERSION }}
        path: winforms/BaridaRecipeManager/bin/Release/BaridaRecipeManager.zip
        retention-days: 30
    
    - name: Commit to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add frontend/public/downloads/BaridaRecipeManager.zip
        git add frontend/public/downloads/BaridaRecipeManager.exe
        git diff --staged --quiet || git commit -m "Auto-update app to v${{ steps.version.outputs.VERSION }}"
        git push
