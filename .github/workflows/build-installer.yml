name: Build and Deploy App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Restore NuGet packages
      working-directory: winforms/BaridaRecipeManager
      run: nuget restore BaridaRecipeManager.csproj -PackagesDirectory ../packages
    
    - name: Build WinForms Application
      working-directory: winforms/BaridaRecipeManager
      run: msbuild BaridaRecipeManager.csproj /p:Configuration=Release /t:Rebuild
    
    - name: Get version
      id: version
      run: |
        $version = (Select-String -Path "winforms/BaridaRecipeManager/Program.cs" -Pattern 'APP_VERSION = "(.+)"').Matches.Groups[1].Value
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
    
    - name: Copy exe to frontend downloads
      run: |
        # Ensure downloads folder exists
        New-Item -ItemType Directory -Path "frontend/public/downloads" -Force | Out-Null
        
        # Copy single exe (Costura.Fody embeds all DLLs)
        Copy-Item "winforms/BaridaRecipeManager/bin/Release/BaridaRecipeManager.exe" "frontend/public/downloads/BaridaRecipeManager.exe" -Force
        
        # Show file size and verify Costura embedded DLLs
        $size = (Get-Item "frontend/public/downloads/BaridaRecipeManager.exe").Length / 1MB
        echo "Exe size: $([math]::Round($size, 2)) MB"
        
        if ($size -lt 1) {
          echo "::warning::EXE is smaller than 1 MB - Costura.Fody may not have embedded DLLs!"
          # List bin/Release contents for debugging
          Get-ChildItem "winforms/BaridaRecipeManager/bin/Release/" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
        }
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BaridaRecipeManager-v${{ steps.version.outputs.VERSION }}
        path: frontend/public/downloads/BaridaRecipeManager.exe
        retention-days: 30
    
    - name: Commit to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add frontend/public/downloads/BaridaRecipeManager.exe
        git diff --staged --quiet || git commit -m "Auto-update app to v${{ steps.version.outputs.VERSION }}"
        git push
